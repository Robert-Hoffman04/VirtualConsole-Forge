[workspace]
resolver = "2"
members = [
    "crates/vc-core",
    "crates/vc-cli",
    "crates/vc-tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
